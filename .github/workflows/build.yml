name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clean old Buildozer cache
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-dev openjdk-17-jdk unzip autoconf automake libtool pkg-config libffi-dev zlib1g-dev

      - name: Install Buildozer
        run: |
          pip install -U buildozer cython virtualenv

      - name: Build APK with self-healing
        run: |
          buildozer -v android debug || {
            echo "=== First attempt failed, applying fixes and retrying ==="

            SDK=$HOME/.buildozer/android/platform/android-sdk
            mkdir -p $SDK/licenses
            cat > $SDK/licenses/android-sdk-license << 'EOF'
          8933bad161af4178b1185d1e37200b9d
          d56f5187479451eabf01fb78af6dfcb131a6481e
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          656503b63140fba2cfe9ca5fa3e8f94e8fbd93d2
          EOF
            SDKM=$(find $SDK -name sdkmanager -type f | head -1)
            if [ -n "$SDKM" ]; then yes | $SDKM --licenses || true; fi

            LIBFFI_AC=$(find ~/.buildozer -type f -path "*libffi*" -name "configure.ac" 2>/dev/null | head -1)
            if [ -n "$LIBFFI_AC" ]; then
              FIXDIR=$(dirname "$LIBFFI_AC")
              echo "Fixing libffi in $FIXDIR"
              (cd "$FIXDIR" && libtoolize --copy --force && autoreconf -vfi) || true
            else
              echo "libffi sources not present yet, skipping autotools fix"
            fi

            echo "=== Retrying build ==="
            buildozer -v android debug
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
