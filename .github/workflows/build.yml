name: Build APK (Native Ubuntu)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-dev openjdk-17-jdk unzip autoconf automake libtool libltdl-dev pkg-config libffi-dev zlib1g-dev

      - name: Install Buildozer & Cython
        run: |
          pip install -U buildozer cython

      - name: Clean old Buildozer cache
        run: |
          rm -rf ~/.buildozer .buildozer

            - name: Prepare Android SDK (Cmdline Tools)
         run: |
          SDK_ROOT=\$HOME/.buildozer/android/platform/android-sdk
          mkdir -p \$SDK_ROOT
          
          # Скачиваем и распаковываем
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/tools.zip
          unzip -q /tmp/tools.zip -d /tmp/tools_extract
          
          # Кладем в современный путь (для наших команд лицензий)
          mkdir -p \$SDK_ROOT/cmdline-tools
          cp -r /tmp/tools_extract/cmdline-tools \$SDK_ROOT/cmdline-tools/latest
          
          # Кладем в старый путь (для Buildozer, который иначе падает)
          cp -r /tmp/tools_extract/cmdline-tools \$SDK_ROOT/tools

      - name: Accept Licenses & Install Build Tools
        run: |
          SDK_ROOT=\$HOME/.buildozer/android/platform/android-sdk
          # Используем путь из cmdline-tools/latest — он свежий и правильный
          CMD_TOOLS=\$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
          
          # Принимаем лицензии
          yes | \$CMD_TOOLS --licenses > /dev/null 2>&1 || true
          
          # Ставим компоненты
          \$CMD_TOOLS "build-tools;34.0.0" "platforms;android-33" "platform-tools" || true

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: apk-package
          path: bin/*.apk
