name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clean old caches
        run: |
          rm -rf ~/.buildozer .buildozer

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-dev openjdk-17-jdk unzip autoconf automake libtool pkg-config libffi-dev zlib1g-dev

      - name: Install Buildozer
        run: |
          pip install -U buildozer cython virtualenv

      - name: Build APK (attempt 1 - installs SDK and NDK)
        run: buildozer -v android debug || true

      - name: Accept Android SDK licenses
        run: |
          SDK=$HOME/.buildozer/android/platform/android-sdk
          if [ -x "$SDK/tools/bin/sdkmanager" ]; then
            yes | $SDK/tools/bin/sdkmanager --licenses || true
          fi
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses || true
          fi

      - name: Build APK (final)
        run: buildozer -v android debug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
