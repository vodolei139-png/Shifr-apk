name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clean old caches
        run: |
          rm -rf ~/.buildozer .buildozer

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-dev openjdk-17-jdk unzip autoconf automake libtool pkg-config libffi-dev zlib1g-dev

      - name: Install Buildozer
        run: |
          pip install -U buildozer cython virtualenv

      - name: Build APK (attempt 1 - installs SDK and NDK)
        run: buildozer -v android debug || true

      - name: Accept ALL Android SDK licenses
        run: |
          SDK=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK/licenses
          cat > $SDK/licenses/android-sdk-license << 'EOF'
          8933bad161af4178b1185d1e37200b9d
          d56f5187479451eabf01fb78af6dfcb131a6481e
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          656503b63140fba2cfe9ca5fa3e8f94e8fbd93d2
          EOF
          SDKM=$(find $SDK -name sdkmanager -type f | head -1)
          if [ -n "$SDKM" ]; then yes | $SDKM --licenses || true; fi
      - name: Fix Autotools / Libtool issue for libffi
        run: |
          # Находим директорию с исходниками libffi, которые качает Buildozer
          LIBFFI_DIR=\$(find ~/.buildozer/android/platform/build-arm64-v8a/build/other_builds/libffi/arm64-v8a__ndk_target_23/libffi -type d -name "libffi-*" | head -n 1)
          
          if [ -n "$LIBFFI_DIR" ] && [ -f "$LIBFFI_DIR/configure.ac" ]; then
            echo "Found libffi source at: \$LIBFFI_DIR"
            cd "\$LIBFFI_DIR"
            
            # 1. Запускаем libtoolize, чтобы создать недостающие макросы
            libtoolize --force --copy
            
            # 2. Запускаем autoupdate, чтобы убрать устаревшие макросы (вроде AC_TRY_LINK)
            autoupdate
            
            # 3. Перегенерируем configure
            autoreconf -vfi
            echo "Autotools fix applied successfully."
          else
            echo "Warning: Could not find libffi source directory. Skipping fix."
          fi

      - name: Build APK (final with fixed libffi)
        run: buildozer -v android debug

      - name: Build APK (final)
        run: buildozer -v android debug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
