name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clean old Buildozer cache
        run: |
          rm -rf ~/.buildozer .buildozer

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-dev openjdk-17-jdk unzip autoconf automake libtool pkg-config libffi-dev zlib1g-dev

      - name: Install Buildozer
        run: |
          pip install -U buildozer cython virtualenv

      - name: Build APK with self-healing
        run: |
          buildozer -v android debug || {
            echo "=== First attempt failed, applying fixes and retrying ==="
            SDK=$HOME/.buildozer/android/platform/android-sdk

            # 1) Свежие cmdline-tools в правильной структуре папок
            if [ ! -x $SDK/cmdline-tools/latest/bin/sdkmanager ]; then
              wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/clt.zip
              rm -rf /tmp/clt
              unzip -q /tmp/clt.zip -d /tmp/clt
              mkdir -p $SDK/cmdline-tools/latest
              mv /tmp/clt/cmdline-tools/* $SDK/cmdline-tools/latest/
            fi

            # 2) Принимаем лицензии рабочим sdkmanager
            yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

            # 3) Ставим build-tools и platform напрямую
            $SDK/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "build-tools;33.0.2" "platforms;android-33" || true

            # 4) Чиним libffi, если её исходники уже скачаны
            LIBFFI_AC=$(find ~/.buildozer -type f -path "*libffi*" -name configure.ac 2>/dev/null | head -1)
            if [ -n "$LIBFFI_AC" ]; then
              (cd "$(dirname "$LIBFFI_AC")" && libtoolize --copy --force && autoreconf -vfi) || true
            fi

            echo "=== Retrying build ==="
            buildozer -v android debug
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
