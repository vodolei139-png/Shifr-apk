name: Build APK (Native Ubuntu)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # ВАЖНО: libltdl-dev добавлен сюда, чтобы исправить ошибку LT_SYS_SYMBOL_USCORE
          sudo apt-get install -y build-essential git python3 python3-dev openjdk-17-jdk unzip autoconf automake libtool libltdl-dev pkg-config libffi-dev zlib1g-dev

      - name: Install Buildozer & Cython
        run: |
          pip install -U buildozer cython

      - name: Clean old Buildozer cache
        run: |
          rm -rf ~/.buildozer .buildozer

      - name: Prepare Android SDK (Cmdline Tools)
        run: |
          SDK_ROOT=\HOME/.buildozer/android/platform/android-sdk
          CMD_TOOLS_DIR=\SDK_ROOT/cmdline-tools
          mkdir -p \CMD_TOOLS_DIR
          
          # Скачиваем свежие command line tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/tools.zip
          unzip -q /tmp/tools.zip -d /tmp/tools_extract
          mv /tmp/tools_extract/cmdline-tools \CMD_TOOLS_DIR/latest
          
          # Создаем симлинк для совместимости со старыми скриптами, если потребуется
          ln -s CMD_TOOLS_DIR/latest CMD_TOOLS_DIR/current

      - name: Accept Licenses & Install Build Tools
        run: |
          SDK_ROOT=\HOME/.buildozer/android/platform/android-sdk
          CMD_TOOLS=\SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
          
          # Принимаем все лицензии автоматически
          echo "y" | \CMD_TOOLS --licenses > /dev/null 2>&1
          
          # Устанавливаем необходимые компоненты
          \$CMD_TOOLS "build-tools;34.0.0" "platforms;android-33" "ndk;28.1.1" > /dev/null 2>&1

      - name: Build APK with Buildozer
        run: |
          # Отключаем автоматическую загрузку SDK внутри buildozer через переменную окружения или конфиг
          # Но проще всего просто запустить, так как мы уже создали структуру папок и положили туда sdkmanager
          buildozer -v android debu

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: apk-package
          path: bin/*.apk
