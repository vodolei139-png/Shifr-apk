name: Build APK (Native Ubuntu)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-dev openjdk-17-jdk unzip autoconf automake libtool libltdl-dev pkg-config libffi-dev zlib1g-dev

      - name: Install Buildozer and Cython
        run: |
          pip install -U buildozer cython

      - name: Clean old Buildozer cache
        run: |
          rm -rf ~/.buildozer .buildozer

      - name: Patch pyjnius recipe
        run: |
          P4A_DIR=$HOME/p4a-patched
          git clone --depth 1 https://github.com/kivy/python-for-android.git $P4A_DIR
          sed -i 's/1\.7\.0/1.8.0/g' $P4A_DIR/pythonforandroid/recipes/pyjnius/__init__.py
          grep -c "1.8.0" $P4A_DIR/pythonforandroid/recipes/pyjnius/__init__.py || echo "WARNING: patch target not found"

      - name: Prepare Android SDK (Cmdline Tools)
        run: |
          SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/tools.zip
          unzip -q /tmp/tools.zip -d /tmp/tools_extract
          cp -r /tmp/tools_extract/cmdline-tools $SDK_ROOT/cmdline-tools/latest
          cp -r /tmp/tools_extract/cmdline-tools $SDK_ROOT/tools

      - name: Accept Licenses and Install Build Tools
        run: |
          SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          CMD_TOOLS=$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
          yes | $CMD_TOOLS --licenses
          $CMD_TOOLS "build-tools;34.0.0" "platforms;android-33" "platform-tools"

      - name: Force single arch in buildozer.spec
        run: |
          sed -i '/^android\.arch/d' buildozer.spec
          sed -i '/^
$$
android
$$
/a android.archs = arm64-v8a' buildozer.spec
          sed -i '/^p4a\.source_dir/d' buildozer.spec
          sed -i '/^orientation = portrait/a p4a.source_dir = ~/p4a-patched' buildozer.spec
          echo "--- spec check ---"
          grep -nE "android\.archs|p4a\.source_dir" buildozer.spec

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: apk-package
          path: bin/*.apk
