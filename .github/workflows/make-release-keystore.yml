name: Make release keystore
on: workflow_dispatch

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Generate release keystore
        run: |
          keytool -genkeypair -v -keystore shifr-release.keystore \
            -storepass Shifr2026! -alias shifr -keypass Shifr2026! \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Shifr, O=Vodolei, C=RU"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: shifr-release.keystore
